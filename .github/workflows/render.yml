name: Render POS Coupon

on:
  workflow_dispatch:
  push:
    paths:
      - "data/coupon.json"
      - "assets/whiskey.png"
      - "render.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render coupon
        run: python render.py

      - name: Commit generated coupon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/coupon.png
          git diff --cached --quiet || git commit -m "Update rendered coupon"
          git push
